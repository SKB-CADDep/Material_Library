services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: material_library_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./source.json:/app/source.json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    container_name: material_library_frontend
    restart: always
    ports:
      - "5000:80"
    depends_on:
      backend:
        condition: service_healthy
